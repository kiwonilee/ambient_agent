[project]
name = "ambient-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-adk[a2a,agent-identity]>=2.2.0",
  "google-cloud-storage>=2.10.0",
  "google-cloud-monitoring>=2.20.0",
  "mcp>=1.27.1,<2.0.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
ambient-agent = "ambient_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
